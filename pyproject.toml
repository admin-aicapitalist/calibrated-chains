[project]
name = "system-one-clef"
version = "0.1.0"
description = "Clef-Flash (System One) decisions composed with a symbolic Decision monad"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.11",
    "torchvision",
    "transformers>=5.10.2",
    "safetensors",
    "pillow",
    "huggingface_hub",
    "accelerate",
    "pyarrow>=25.0.1",
    "pandas>=3.0.6",
    "numpy>=2.5.3",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
